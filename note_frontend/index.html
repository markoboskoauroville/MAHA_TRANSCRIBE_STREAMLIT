<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* THE NOTE, OPEN.
     Baba: "the note is taking over the user interface, like opening a
     new document in Microsoft Word."

     Everything lives in this frame — the text, the selection arrows, the
     line controls. It has to: Streamlit's own text_area gives Python no
     way to see where the cursor is, and selection is entirely about the
     cursor. A component owns its own textarea and therefore its own
     selection. */

  :root {
    --ink:   #e8e2d6;
    --dim:   #8b8375;
    --amber: #E8A64B;
    --dark:  #0e1116;
    --face:  #161b22;
    --edge:  #2a3038;
    --rec:   #d9484b;   /* the one red in the app, and only for recording */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink);
  }

  #wrap {
    background: var(--dark); border: 1px solid var(--edge);
    border-radius: 12px; padding: 0.6rem; display: flex;
    flex-direction: column; gap: 0.5rem;
  }

  /* ---- the writing surface -------------------------------------- */
  /* THE SIZE COMES FROM PYTHON, but a readable floor is set here so a
     missing or broken scale can never leave someone squinting. This is a
     READING SURFACE and hard rule 6 says the text-size control governs
     it — but "governs" must not mean "is the only thing standing between
     the reader and 0.16px". */
  #ta {
    font-size: 1.05rem;
    width: 100%; min-height: 15rem; resize: vertical;
    background: var(--face); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 10px;
    padding: 0.75rem; line-height: 1.55;
    /* overflow-wrap, never word-break: ordinary prose keeps its shape
       and only a genuinely oversized word is broken (rule 6). */
    overflow-wrap: break-word;
    font-family: inherit;
  }
  #ta:focus { outline: none; border-color: var(--amber); }

  /* ---- the bars --------------------------------------------------- */
  /* WRAPS, and that is deliberate. nowrap held the five arrows on one
     line and pushed 29px off the right edge at 250% text — a WCAG 1.4.10
     failure, and rule 6 says that is as serious as losing a recording.
     A second row of arrows costs one line; sideways scrolling costs
     someone the control entirely. This is the opposite call from the
     command row (§27), because there the cells could shrink their type
     and here the target must not shrink at all. */
  .bar { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .bar button { flex: 1 1 auto; min-width: 3.2rem; }
  .bar button {
    flex: 1 1 auto; min-width: 0;
    background: var(--face); color: var(--ink);
    border: 1px solid var(--edge); border-radius: 9px;
    /* 44px, and it does NOT shrink with the type. A shaking hand needs
       the target whatever size the letters are. */
    /* 44px stays px ON PURPOSE. It is a physical target for a shaking
       hand (WCAG 2.5.5 at the AAA figure), not text, and it must not
       shrink when someone turns their font size down. */
    min-height: 44px;
    font-family: inherit;
    /* Everything TEXTUAL is rem, so the reader's own OS and browser font
       setting still scales it — rule 6, and the first thing a person
       with low vision will already have turned up. */
    font-size: 0.82rem;
    cursor: pointer; display: flex; align-items: center;
    justify-content: center; gap: 0.3rem; padding: 0 0.5rem;
  }
  .bar button:hover { border-color: var(--amber); }
  .bar button:active { background: #1d232c; }
  /* A VISIBLE FOCUS RING. Rule 6 asks for one and these buttons had
     none: a keyboard user could not see which arrow they were on. */
  .bar button:focus-visible, #ta:focus-visible {
    outline: 2px solid var(--amber); outline-offset: 2px;
  }

  /* The selection arrows are a set, so they read as one control. */
  #sel button { font-size: 1.05rem; letter-spacing: 0; }

  /* ---- the red dot ------------------------------------------------ */
  /* Baba: "at the bottom of the note is a record button, red dot" — the
     same red as the cassette deck's, because it means the same thing in
     both places. Colour is reserved for state, and this is the only
     state loud enough to earn it. */
  /* The red key takes the room the two small ones give up. */
  #rec { flex: 3 1 auto; padding: 0 0.6rem; gap: 0.4rem; }
  .wee { flex: 1 1 auto; font-size: 0.72rem !important; }

  /* The clock only exists while recording, so it does not sit there
     reading 0:00 and inviting the question "is it on?" */
  #clk { font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
         display: none; }
  #rec.on #clk { display: inline; }

  /* THE METER IS VERTICAL and tiny, as asked. It is the one thing on
     this bar that must not be able to lie: if it moves, sound is
     arriving. Driven from a real AnalyserNode, never from a timer. */
  #vu { display: none; width: 0.28rem; height: 1.15rem;
        background: #2a1517; border-radius: 2px; overflow: hidden;
        position: relative; flex: none; }
  #rec.on #vu { display: block; }
  #vu i { position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
          background: var(--rec); display: block; }

  /* Recording is the loudest state in the app, so it is the only one
     that gets the red fill rather than a red outline. */
  #rec.on { background: rgba(217, 72, 75, 0.14); }
  .dot {
    width: 0.7rem; height: 0.7rem; border-radius: 50%;
    background: var(--rec); flex: none;
  }
  #rec.on { border-color: var(--rec); color: var(--rec); }
  #rec.on .dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
  @media (prefers-reduced-motion: reduce) {
    #rec.on .dot { animation: none; opacity: .8 }
  }

  #msg { color: var(--dim); font-size: 0.7rem; min-height: 0; }
  #msg.bad { color: var(--rec); }
  #meta {
    color: var(--dim); font-size: 0.7rem;
    display: flex; justify-content: space-between; gap: 0.5rem;
  }
</style>
</head>
<body>
<div id="wrap">
  <textarea id="ta" spellcheck="false"></textarea>

  <!-- SELECTION. Baba: "the sign is less than and greater than, and they
       select the word automatically — like a Shift arrow." Left and
       right take a word at a time; up and down take a line. -->
  <div class="bar" id="sel">
    <button type="button" id="bWL" title="select the word before">‹</button>
    <button type="button" id="bWR" title="select the word after">›</button>
    <button type="button" id="bLU" title="select the line above">⌃</button>
    <button type="button" id="bLD" title="select the line below">⌄</button>
    <button type="button" id="bAll" title="select everything">▣</button>
  </div>

  <!-- THE DECK, IN MINIATURE. Baba: "imagine this bar as a smaller
       version of the recorder... it means the recording is also a Stop
       button." Same idea as the big deck upstairs, in one row: the red
       key is wide because it is the thing you reach for, and cut and
       line are small because they are not. -->
  <!-- A TRANSPORT, NOT A ROW OF ACTIONS. Baba: "all these action
       buttons beside recording should go out, we don't have anything,
       just record... in the remote we need to have all buttons: record,
       pause, stop."
       Cut and line are gone from here: the arrows above already delete
       what they select, so those two were a second way to do the same
       thing sitting where the transport belongs. -->
  <div class="bar" id="acts">
    <button type="button" id="rec" title="record into this note">
      <span class="dot"></span><span id="lRec">rec</span>
      <span id="clk"></span><span id="vu"><i></i></span>
    </button>
    <button type="button" id="bPause" class="wee" disabled>
      <span class="pz"></span><span id="lPause">pause</span></button>
    <button type="button" id="bStop" class="wee" disabled>
      <span class="sq"></span><span id="lStop">stop</span></button>
  </div>

  <div id="meta"><span id="mLeft"></span><span id="mRight"></span></div>
  <div id="msg"></div>
</div>

<script>
var ta = document.getElementById('ta');
var LAST = null, RECORDING = false;

function post(t, o) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: t }, o), '*');
}
function ready() { post('streamlit:componentReady', { apiVersion: 1 }); }
function height() {
  post('streamlit:setFrameHeight', { height: document.body.scrollHeight + 6 });
}
function setValue(v) {
  post('streamlit:setComponentValue', { value: v, dataType: 'json' });
}

/* ------------------------------------------------------------------ */
/*  SELECTION                                                          */
/*                                                                     */
/*  Word boundaries are computed here rather than leaning on the        */
/*  browser's own word-select, because that varies between browsers and */
/*  treats Croatian diacritics inconsistently. A word is a run of       */
/*  letters, digits, apostrophes and hyphens; everything else is a      */
/*  boundary.                                                          */
/* ------------------------------------------------------------------ */

function isWordChar(c) {
  return c && /[^\s.,;:!?()\[\]{}"“”„'`\/\\—–-]/.test(c);
}

function extendWord(dir) {
  var v = ta.value;
  /* GROW FROM THE FAR END, so pressing › twice takes two words rather
     than re-taking the first. The anchor is whichever end is not moving. */
  var a = ta.selectionStart, b = ta.selectionEnd;
  var i = dir > 0 ? b : a;

  if (dir > 0) {
    while (i < v.length && !isWordChar(v[i])) i++;
    while (i < v.length && isWordChar(v[i])) i++;
    ta.setSelectionRange(a, i);
  } else {
    while (i > 0 && !isWordChar(v[i - 1])) i--;
    while (i > 0 && isWordChar(v[i - 1])) i--;
    ta.setSelectionRange(i, b);
  }
  ta.focus();
  report();
}

function lineBounds(pos) {
  var v = ta.value;
  var s = v.lastIndexOf('\n', pos - 1) + 1;
  var e = v.indexOf('\n', pos);
  if (e < 0) e = v.length;
  return [s, e];
}

function extendLine(dir) {
  /* FINISH THE LINE YOU ARE ON BEFORE TAKING THE NEXT.
     The first version jumped straight to the end of the FOLLOWING line,
     so one press from the start of the text selected two lines. Caught
     by clicking it in a browser: from the cursor, one press should give
     the line the cursor is in, and only then should a second press take
     another. */
  var v = ta.value;
  var a = ta.selectionStart, b = ta.selectionEnd;

  if (dir > 0) {
    var endHere = lineBounds(b)[1];
    if (b < endHere) {              // not yet at the end of this line
      ta.setSelectionRange(a, endHere);
    } else if (endHere >= v.length) {
      ta.setSelectionRange(a, v.length);
    } else {
      ta.setSelectionRange(a, lineBounds(endHere + 1)[1]);
    }
  } else {
    var startHere = lineBounds(a)[0];
    if (a > startHere) {            // not yet at the start of this line
      ta.setSelectionRange(startHere, b);
    } else if (startHere <= 0) {
      ta.setSelectionRange(0, b);
    } else {
      ta.setSelectionRange(lineBounds(startHere - 1)[0], b);
    }
  }
  ta.focus();
  report();
}

function cutSelection() {
  var a = ta.selectionStart, b = ta.selectionEnd;
  if (a === b) return;                       // nothing chosen, do nothing
  ta.value = ta.value.slice(0, a) + ta.value.slice(b);
  ta.setSelectionRange(a, a);
  ta.focus();
  changed();
}

function cutLine() {
  var p = ta.selectionStart;
  var lb = lineBounds(p);
  var s = lb[0], e = lb[1];
  if (e < ta.value.length) e += 1;           // take the newline with it
  else if (s > 0) s -= 1;                    // last line: take the one before
  ta.value = ta.value.slice(0, s) + ta.value.slice(e);
  ta.setSelectionRange(s, s);
  ta.focus();
  changed();
}

/* ------------------------------------------------------------------ */

function say(text, bad) {
  var el = document.getElementById('msg');
  el.textContent = text || '';
  el.classList.toggle('bad', !!bad);
  height();
}

function words(s) {
  var m = String(s || '').trim().match(/\S+/g);
  return m ? m.length : 0;
}

function report() {
  var a = ta.selectionStart, b = ta.selectionEnd;
  var picked = b - a;
  document.getElementById('mRight').textContent =
    picked > 0 ? (picked + ' selected') : '';
}

function changed() {
  document.getElementById('mLeft').textContent =
    words(ta.value) + ' words · ' + ta.value.length;
  report();
  height();
  /* The text goes back on every change, stamped, so Python holds the
     truth and a rerun cannot lose what was typed. */
  setValue({ at: Date.now(), text: ta.value });
}

['bWL','bWR','bLU','bLD','bAll','bCut','bLine'].forEach(function (id) {
  document.getElementById(id).addEventListener('click', function (e) {
    e.preventDefault();
    if (id === 'bWL')  extendWord(-1);
    if (id === 'bWR')  extendWord(1);
    if (id === 'bLU')  extendLine(-1);
    if (id === 'bLD')  extendLine(1);
    if (id === 'bAll') { ta.select(); ta.focus(); report(); }
    if (id === 'bCut')  cutSelection();
    if (id === 'bLine') cutLine();
  });
});

ta.addEventListener('input', changed);
ta.addEventListener('select', report);
ta.addEventListener('keyup', report);
ta.addEventListener('click', report);

/* ------------------------------------------------------------------ */
/*  RECORDING, INSIDE THE NOTE                                         */
/*                                                                     */
/*  The red key used to only ASK, and Python did the recording through  */
/*  the big deck. That could not give Baba what he asked for: a clock   */
/*  and a level meter need to update thirty times a second from the     */
/*  audio stream itself, and Streamlit cannot push anything at that     */
/*  rate. A meter fed by Python would be a decoration, and §22 is       */
/*  explicit that a scope which is not reading real sound is worse than */
/*  no scope.                                                          */
/*                                                                     */
/*  So this frame captures. It deliberately does NOT reimplement the    */
/*  deck: no chunking, no offline queue, no retry ladder. It takes one  */
/*  short take, hands the bytes to Python in the SAME shape the deck    */
/*  uses — b64 / mime / seconds / bytes — and the whole pipeline below  */
/*  that is shared. Long recordings still belong upstairs.             */
/* ------------------------------------------------------------------ */

/* Labels, overridable from Python. Declared HERE, above the first
   function that reads them — they were originally added at the top of
   the OTHER component by a careless edit, so setRecording() threw
   "L_STOP is not defined" on the first press and took the meter, the
   clock and the message line down with it. The button still toggled,
   which is why it looked like it worked. */
var L_REC = 'rec', L_STOP = 'stop',
    L_PAUSE = 'pause', L_RESUME = 'resume',
    L_MICNO = 'microphone refused — check the browser permission',
    L_NOTHING = 'nothing was recorded',
    L_TOOBIG = 'too long for a note — use the deck above',
    L_SENDING = 'transcribing…',
    L_SENDFAIL = 'could not send that take';

var MAX_SEND = 30 * 1024 * 1024;   // the websocket ceiling, base64'd
var mediaRec = null, mediaStream = null, chunks = [], recT0 = 0;
var actx = null, analyser = null, vuRaf = null, clockT = null;

var recBtn = document.getElementById('rec');
var vuBar  = document.querySelector('#vu i');
var clkEl  = document.getElementById('clk');

function mmss(ms) {
  var s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
}

function paintVU() {
  if (!analyser) return;
  var buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  /* Peak, not average. An average of a waveform centred on 128 barely
     moves for speech and the meter looks dead while somebody is
     talking — which is exactly the lie this must not tell. */
  var peak = 0;
  for (var i = 0; i < buf.length; i++) {
    var d = Math.abs(buf[i] - 128);
    if (d > peak) peak = d;
  }
  var pct = Math.min(100, (peak / 90) * 100);
  vuBar.style.height = pct.toFixed(0) + '%';
}

function setRecording(on) {
  RECORDING = on;
  recBtn.classList.toggle('on', on);
  document.getElementById('lRec').textContent = on ? L_STOP : L_REC;
  if (!on) PAUSED = false;
  transportState();
  if (!on) {
    if (vuRaf) { clearInterval(vuRaf); vuRaf = null; }
    if (clockT) { clearInterval(clockT); clockT = null; }
    vuBar.style.height = '0%';
    clkEl.textContent = '';
  }
  height();
}

function stopTracks() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(function (t) { t.stop(); });
    mediaStream = null;
  }
  if (actx) { try { actx.close(); } catch (e) {} actx = null; }
  analyser = null;
}

async function startRec() {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: false,
               noiseSuppression: false, autoGainControl: false }
    });
  } catch (e) {
    say(L_MICNO, true);
    return;
  }

  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    var src = actx.createMediaStreamSource(mediaStream);
    analyser = actx.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
  } catch (e) {
    analyser = null;           // no meter is fine; no recording is not
  }

  chunks = [];
  try {
    mediaRec = new MediaRecorder(mediaStream);
  } catch (e) {
    stopTracks();
    say(L_MICNO, true);
    return;
  }
  mediaRec.ondataavailable = function (ev) {
    if (ev.data && ev.data.size) chunks.push(ev.data);
  };
  mediaRec.onstop = function () { finishRec(); };
  mediaRec.start();

  recT0 = Date.now();
  setRecording(true);
  clkEl.textContent = '0:00';
  clockT = setInterval(function () {
    clkEl.textContent = mmss(Date.now() - recT0);
  }, 250);
  /* AN INTERVAL, NOT requestAnimationFrame. rAF is throttled to nothing
     when the tab is in the background or the browser is headless, and a
     level meter that has stopped moving says "no sound is arriving" —
     the exact lie §22 forbids. 20 fps is plenty for a level bar and it
     keeps running wherever the page is. */
  if (analyser) vuRaf = setInterval(paintVU, 50);
}

function finishRec() {
  var secs = (Date.now() - recT0) / 1000;
  var type = (chunks[0] && chunks[0].type) || 'audio/webm';
  var blob = new Blob(chunks, { type: type });
  chunks = [];
  stopTracks();
  setRecording(false);

  if (!blob.size) { say(L_NOTHING, true); return; }
  if (blob.size > MAX_SEND) { say(L_TOOBIG, true); return; }

  say(L_SENDING);
  var fr = new FileReader();
  fr.onerror = function () { say(L_SENDFAIL, true); };
  fr.onload = function () {
    var str = String(fr.result || ''), i = str.indexOf(',');
    /* The SAME shape the deck posts, so Python's existing path takes it
       without a second branch to keep in step. */
    setValue({ at: Date.now(), text: ta.value,
               b64: i < 0 ? str : str.slice(i + 1),
               mime: type, seconds: secs, bytes: blob.size });
  };
  fr.readAsDataURL(blob);
}

/* ONE KEY, TWO JOBS. Baba: "when I press Record, then it turns to Stop,
   and when I press Stop, it is set text." A separate stop key would sit
   dead most of the time and be the wrong one to reach for in a hurry. */
var pauseBtn = document.getElementById('bPause');
var stopBtn  = document.getElementById('bStop');
var PAUSED = false, pauseAt = 0;

function transportState() {
  pauseBtn.disabled = !RECORDING;
  stopBtn.disabled = !RECORDING;
  document.getElementById('lPause').textContent = PAUSED ? L_RESUME : L_PAUSE;
}

/* REC STARTS, and still stops — a hand reaching for the red key
   mid-take means to end it. Pause and stop sit beside it so the note's
   transport reads the same as the deck's upstairs. */
recBtn.addEventListener('click', function (e) {
  e.preventDefault();
  if (RECORDING) {
    try { mediaRec.stop(); } catch (err) { finishRec(); }
  } else {
    startRec();
  }
});

pauseBtn.addEventListener('click', function (e) {
  e.preventDefault();
  if (!RECORDING || !mediaRec) return;
  try {
    if (PAUSED) {
      mediaRec.resume();
      /* The clock must not count the pause. Moving the start forward by
         the time spent paused keeps it showing recorded seconds rather
         than elapsed ones. */
      recT0 += Date.now() - pauseAt;
    } else {
      mediaRec.pause();
      pauseAt = Date.now();
    }
    PAUSED = !PAUSED;
    transportState();
  } catch (err) { /* a recorder that cannot pause simply keeps going */ }
});

stopBtn.addEventListener('click', function (e) {
  e.preventDefault();
  if (!RECORDING || !mediaRec) return;
  try { mediaRec.stop(); } catch (err) { finishRec(); }
});

window.addEventListener('message', function (ev) {
  var m = ev.data;
  if (!m || m.type !== 'streamlit:render') return;
  var a = m.args || {};

  if (typeof a.text === 'string' && a.text !== LAST) {
    /* Only when Python's copy really differs — writing on every render
       would drag the cursor to the end while somebody is typing. */
    LAST = a.text;
    var keepA = ta.selectionStart, keepB = ta.selectionEnd;
    ta.value = a.text;
    try { ta.setSelectionRange(keepA, keepB); } catch (err) {}
  }
  if (a.scale) {
    /* a11y.py's scale is a MULTIPLIER (0.8 … 2.5), not a percentage.
       Reading it as a percent made "1.0" into "1%" — one hundredth of
       16px — and the note was unreadable with a nose against the screen.
       Baba found it before any test did, which is the whole reason
       reading surfaces get looked at rather than asserted about.

       BASE_REM (1.05) is a11y.py's own floor, applied here so the
       smallest setting is still readable and the largest is genuinely
       large. rem, not px, so the reader's own OS font setting still
       multiplies it. */
    ta.style.fontSize = (Number(a.scale) * 1.05).toFixed(3) + 'rem';
  }
  if (a.labels) {
    if (a.labels.rec)  { L_REC = a.labels.rec;
                         if (!RECORDING)
                           document.getElementById('lRec').textContent = L_REC; }
    if (a.labels.stop)  L_STOP = a.labels.stop;
    if (a.labels.pause) { L_PAUSE = a.labels.pause; transportState(); }
    if (a.labels.cut)  document.getElementById('lCut').textContent = a.labels.cut;
    if (a.labels.line) document.getElementById('lLine').textContent = a.labels.line;
  }
  /* RECORDING IS OWNED HERE NOW, not by Python. A render arriving
     mid-take must not switch the key back to "rec" while the microphone
     is still open. */

  document.getElementById('mLeft').textContent =
    words(ta.value) + ' words · ' + ta.value.length;
  height();
});

ready();
height();
</script>
</body>
</html>
