<!DOCTYPE html>
<html><body style="margin:0">
<!--
  Part player for TTT-LLL.

  Plays ONE part of the text and tells Python when it has finished, so
  the next part can be made and swapped into the same place. Baba's
  design: "you just remove that player and put at the same place the
  other player... just a text 1/3".

  Why parts at all, measured rather than assumed: Edge has no hard length
  limit (9000 characters synthesised fine) but the WAIT scales with it -
  1500 chars takes about 21s to make and yields about 100s of speech,
  while 6000 chars takes 107s before a single word is heard. Parts mean
  playing starts after the first short wait, and every later part is
  prepared while the previous one plays.

  Two-way (declare_component) because the 'ended' signal has to reach
  Python. Same raw postMessage protocol as ls_bridge_frontend, which is
  already proven here and needs no external script.
-->
<style>
  html, body { margin:0; padding:0; background:transparent;
               font-family: ui-monospace, "JetBrains Mono", monospace;
               color:#f2ddb4; }
  .sub {
    border:1px solid #23303d; border-radius:12px; background:#141a21;
    padding:0.9rem 0.8rem; line-height:1.5; letter-spacing:0.012em;
    overflow-wrap:break-word; display:flex; align-items:center;
  }
  .sub b { background:#f59e0b; color:#0b0d10; border-radius:4px;
           padding:1px 4px; font-weight:600; }
  audio { width:100%; margin:0.5rem 0 0.35rem; height:44px; }
  .row { display:flex; gap:0.35rem; align-items:center; }
  .row button {
    min-width:44px; min-height:44px; border-radius:999px;
    background:#141a21; border:1px solid #23303d; color:#f2ddb4;
    font-family:inherit; font-size:1rem; cursor:pointer;
    transition: border-color 90ms ease-out, background-color 90ms ease-out;
  }
  .row button:hover { border-color:#f59e0b; background:rgba(245,158,11,0.10); }
  .row button:active { transform:scale(0.97); }
  .row button:focus-visible { outline:3px solid #f59e0b; outline-offset:2px; }
  .count { margin-left:auto; color:#b1a389; font-size:0.85rem;
           font-variant-numeric:tabular-nums; }
  @media (prefers-reduced-motion: reduce) { .row button { transition:none; } }
</style>

<div class="sub" id="sub" aria-live="polite"></div>
<audio id="a" controls preload="auto"></audio>
<div class="row">
  <button id="prev" aria-label="previous">&#9198;</button>
  <button id="next" aria-label="next">&#9197;</button>
  <span class="count" id="count"></span>
</div>

<script>
function post(type, extra) {
  window.parent.postMessage(Object.assign(
    { isStreamlitMessage: true, type: type }, extra || {}), "*");
}
function setComponentValue(v) {
  post("streamlit:setComponentValue", { value: v, dataType: "json" });
}

var a = document.getElementById('a');
var sub = document.getElementById('sub');
var count = document.getElementById('count');
var M = [], cur = -1, part = 1, parts = 1, loaded = "";

function indexAt(t) {
  for (var i = 0; i < M.length; i++)
    if (t >= M[i].start_time && t < M[i].end_time) return i;
  for (var j = M.length - 1; j >= 0; j--) if (t >= M[j].start_time) return j;
  return 0;
}
function show(i) {
  if (i === cur || !M.length) return;
  cur = i;
  sub.innerHTML = '<b></b>';
  sub.firstChild.textContent = M[i].text;
  // "sentence within part / part of whole" - the engine is visible only
  // as far as Baba asked for, and no further.
  count.textContent = (i + 1) + '/' + M.length + (parts > 1 ? '  \u00b7  ' + part + '/' + parts : '');
}
a.addEventListener('timeupdate', function () { show(indexAt(a.currentTime)); });
a.addEventListener('seeked', function () { show(indexAt(a.currentTime)); });
a.addEventListener('ended', function () {
  // Ask Python for the next part. The stamp makes two consecutive
  // finishes distinct events.
  if (part < parts) setComponentValue({ done_part: part, at: Date.now() });
});
document.getElementById('prev').addEventListener('click', function () {
  var i = Math.max(0, indexAt(a.currentTime) - 1);
  a.currentTime = M[i].start_time; show(i);
});
document.getElementById('next').addEventListener('click', function () {
  var i = Math.min(M.length - 1, indexAt(a.currentTime) + 1);
  a.currentTime = M[i].start_time; show(i);
});

window.addEventListener("message", function (event) {
  var msg = event.data;
  if (!msg || msg.type !== "streamlit:render") return;
  var args = msg.args || {};
  M = args.marks || [];
  part = args.part || 1;
  parts = args.parts || 1;
  var scale = args.scale || 1;
  sub.style.fontSize = (1.35 * scale) + 'rem';
  sub.style.minHeight = (4.4 * 1.35 * scale) + 'rem';
  if (args.src && args.src !== loaded) {
    loaded = args.src;
    a.src = args.src;
    cur = -1;
    show(0);
    if (args.autoplay) { a.play().catch(function () {}); }
  }
  fit();
});

// MEASURE, NEVER GUESS. This posted a hardcoded 250 + 90*(scale-1), which
// is fine until the highlighted sentence runs to four lines — then the
// content is taller than the frame and the transport buttons underneath
// are sliced in half. Baba caught them cut across the middle. The deck
// had exactly this bug with a hardcoded 126.
//
// A ResizeObserver keeps it right as the text changes from sentence to
// sentence, which a one-off measurement would not.
function fit(){
  var h = document.body.getBoundingClientRect().height;
  post("streamlit:setFrameHeight", { height: Math.ceil(h) + 8 });
}
if (window.ResizeObserver) {
  new ResizeObserver(fit).observe(document.body);
}
window.addEventListener('load', fit);

post("streamlit:componentReady", { apiVersion: 1 });
fit();
</script>
</body></html>
