[pytest]
# `test1_wordtimes.py` does not match pytest's default `test_*.py`, so it
# was invisible to the runner even after its import was fixed. One line
# rather than renaming a file that HANDOVER refers to by name.
python_files = test*.py

# The suites print their own tally as they go. pytest captures it and
# shows it under whichever file failed, which is where it is wanted.
addopts = -q
