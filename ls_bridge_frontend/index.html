<!DOCTYPE html>
<html><body style="margin:0">
<script>
function post(type, extra) {
  const data = Object.assign({ isStreamlitMessage: true, type: type }, extra || {});
  window.parent.postMessage(data, "*");
}
function setComponentValue(value) {
  post("streamlit:setComponentValue", { value: value, dataType: "json" });
}
function handleRender(args) {
  try {
    if (args && args.writes) {
      const w = args.writes;
      for (const k in w) {
        if (Object.prototype.hasOwnProperty.call(w, k)) localStorage.setItem(k, w[k]);
      }
    }
    if (args && args.removes && args.removes.length) {
      args.removes.forEach(function (k) { localStorage.removeItem(k); });
    }
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("maha_") === 0) out[k] = localStorage.getItem(k);
    }
    setComponentValue({ ok: true, data: out, stamp: (args && args.stamp) || 0 });
  } catch (e) {
    setComponentValue({ ok: false, error: String(e), data: {} });
  }
}
window.addEventListener("message", function (event) {
  const msg = event.data;
  if (!msg) return;
  if (msg.type === "streamlit:render") {
    handleRender(msg.args);
  }
});
post("streamlit:componentReady", { apiVersion: 1 });
post("streamlit:setFrameHeight", { height: 0 });
</script>
</body></html>
