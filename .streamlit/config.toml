# Tokens taken from Baba's own maha_transcribe app — see ttt/theme.py.
# Streamlit's own theme has to agree with the injected CSS, or its
# built-in widgets fight the design.
[theme]
base = "dark"
primaryColor = "#f59e0b"
backgroundColor = "#0b0d10"
secondaryBackgroundColor = "#141a21"
textColor = "#f2ddb4"
font = "monospace"

[server]
maxUploadSize = 500
