<!doctype html>
<meta charset="utf-8">
<!--
  THE CASSETTE DECK — a real recorder component.

  st.audio_input cannot be restyled into this, so this is a REAL component
  that captures with MediaRecorder and posts the blob back to Python. It
  uses the same raw postMessage protocol as paste_frontend: no npm, no
  build step, one file that Streamlit Cloud serves as-is.

  FORMAT, measured 18.8.2026, not chosen by taste. MediaRecorder cannot
  produce WAV in any browser — the API emits webm/opus, ogg/opus or
  mp4/aac only. Opus at 128 kbit mono was verified transparent: through
  the app's own ffmpeg chain to 16 kHz FLAC, Whisper returned identical
  words to a WAV reference. 32k was NOT transparent ("Sound" came back as
  "Bound"), so the bitrate floor is real. 128k costs about 1 MB a minute,
  where raw WAV would have been 5.8 MB a minute and 345 MB an hour — which
  would not survive the websocket on a long recording.

  The oscilloscope is a real AnalyserMode reading of the live signal, not
  an animation. If it is flat, the microphone is genuinely not receiving,
  and that is the single most useful thing a recorder can tell someone
  before they talk for ten minutes into a dead input.
-->
<style>
  :root {
    --deck:#15181d; --face:#1d2127; --edge:#2b313a; --amber:#f59e0b;
    --dark:#0b0d10; --text:#e5e7eb; --dim:#9aa3af; --rec:#dc2626;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:transparent;
              font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
              color:var(--text); -webkit-user-select:none; user-select:none; }
  #deck { background:var(--deck); border:1px solid var(--edge);
          border-radius:6px; padding:10px; }

  /* the scope window */
  #scopewrap { background:var(--dark); border:1px solid var(--edge);
               border-radius:3px; height:46px; position:relative;
               overflow:hidden; margin-bottom:8px; }
  #scope { display:block; width:100%; height:100%; }
  /* THE CLOCK GETS ITS OWN ZONE. It used to float over the trace, and
     the moment the waveform reached full height the digits were drawn
     straight through and became unreadable — which is precisely when a
     running timer matters most. The scope window is now two zones: the
     trace on the left, a solid black panel on the right that the trace
     cannot enter, with the numbers on top of it. Amber while running, so
     it reads as live at a glance rather than needing to be studied. */
  #clock { position:absolute; right:0; top:0; bottom:0; width:74px;
           display:flex; align-items:center; justify-content:center;
           background:var(--dark); border-left:1px solid var(--edge);
           font-variant-numeric:tabular-nums; font-size:16px;
           letter-spacing:.5px; color:var(--dim); z-index:2; }
  #clock.live { color:var(--amber); }

  /* transport row: square cells, shared borders, sized to fit */
  #row { display:flex; gap:0; }
  .key { flex:1 1 0; height:44px; min-width:0;
         background:var(--face); color:var(--text);
         border:1px solid var(--edge); border-right-width:0;
         font:inherit; font-size:13px; cursor:pointer;
         display:flex; align-items:center; justify-content:center;
         gap:5px; padding:0 2px; }
  .key:last-child { border-right-width:1px; }
  .key:first-child { border-radius:3px 0 0 3px; }
  .key:last-child  { border-radius:0 3px 3px 0; }
  .key:disabled { color:#4b5563; cursor:default; }
  .key.on { background:var(--amber); color:var(--dark); }
  .key.arm { background:var(--rec); color:#fff; }
  .key:focus-visible { outline:3px solid var(--amber); outline-offset:-3px; }
  .dot { width:9px; height:9px; border-radius:50%; background:currentColor;
         flex:none; }
  .sq  { width:9px; height:9px; background:currentColor; flex:none; }
  /* A folder, drawn rather than fetched: the tab is the ::before. */
  .fold { width:11px; height:9px; flex:none; position:relative;
          border:1.5px solid currentColor; border-radius:1px 2px 2px 2px;
          border-top-width:2.5px; }
  .fold::before { content:''; position:absolute; top:-4px; left:-1.5px;
                  width:4px; height:2px; background:currentColor;
                  border-radius:1px 1px 0 0; }
  .par { width:9px; height:9px; flex:none;
         border-left:3px solid currentColor; border-right:3px solid currentColor; }
  /* This line said "sent — 56 KB" and got sliced through the middle of
     the word, because the frame was shorter than the deck. A status line
     that is cut in half reads as a broken app. It now has its own room
     and wraps rather than clipping. */
  #msg { margin-top:7px; min-height:17px; font-size:12px; color:var(--dim);
         line-height:1.35; white-space:normal; overflow-wrap:anywhere; }
  #msg.bad { color:#fca5a5; }
  @media (prefers-reduced-motion: reduce) { #scope { opacity:.85; } }
</style>

<div id="deck">
  <div id="scopewrap">
    <canvas id="scope"></canvas>
    <div id="clock">0:00</div>
  </div>
  <div id="row">
    <button class="key" id="bRec"   aria-label="record"><span class="dot"></span><span id="lRec">rec</span></button>
    <button class="key" id="bPause" aria-label="pause" disabled><span class="par"></span><span id="lPause">pause</span></button>
    <button class="key" id="bStop"  aria-label="stop"  disabled><span class="sq"></span><span id="lStop">stop</span></button>
    <button class="key" id="bFile" aria-label="upload"><span class="fold"></span><span id="lFile">open</span></button>
  </div>
  <textarea id="sink" aria-hidden="true" tabindex="-1" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0"></textarea>
  <input id="picker" type="file" style="display:none" accept="audio/*,video/*">
  <div id="msg" role="status" aria-live="polite"></div>
</div>

<script>
function post(type, extra) {
  window.parent.postMessage(
    Object.assign({ isStreamlitMessage:true, type:type }, extra || {}), "*");
}
function setValue(v) { post("streamlit:setComponentValue", { value:v, dataType:"json" }); }
function height() {
  // Measure, never assume. A fixed number was 126 and the deck grew past
  // it the moment the status line had anything to say.
  var h = document.getElementById('deck').getBoundingClientRect().height;
  post("streamlit:setFrameHeight", { height: Math.ceil(h) + 6 });
}

var bRec=document.getElementById('bRec'), bPause=document.getElementById('bPause'),
    bStop=document.getElementById('bStop'),
    scope=document.getElementById('scope'), clock=document.getElementById('clock'),
    msg=document.getElementById('msg');
var ctx=scope.getContext('2d');

var media=null, rec=null, chunks=[], analyser=null, actx=null, raf=null;
var t0=0, acc=0, running=false, paused=false, lastBlob=null;
var gain=1;                     // smoothed display gain for the scope
var L_OPEN='open', L_RETRY='retry', L_SENDING='sending';

// Below this, the input is effectively dead and the trace stays FLAT on
// purpose. Auto-gain without a floor would amplify the noise of a
// disconnected microphone into a convincing dance, which is the one lie
// this display must never tell.
var FLOOR = 1.2 / 128;

function say(s, bad){
  msg.textContent=s||''; msg.className = bad?'bad':'';
  height();                       // the strip just changed size
}
// spinTick writes msg directly and deliberately does NOT call height():
// re-measuring the frame ten times a second would post a resize on every
// tick for a line that never changes height.
function mmss(ms){
  var s=Math.floor(ms/1000); return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
}
function elapsed(){ return acc + (running && !paused ? Date.now()-t0 : 0); }

var CLOCK_W = 74;      // must match #clock width; the trace stops here

function fit(){
  var r=scope.getBoundingClientRect(), d=window.devicePixelRatio||1;
  scope.width=Math.max(1,Math.round(r.width*d));
  scope.height=Math.max(1,Math.round(r.height*d));
  ctx.setTransform(d,0,0,d,0,0);
}

function flatline(){
  fit();
  var w=scope.clientWidth-CLOCK_W, h=scope.clientHeight;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle='#2b313a'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
}

function draw(){
  raf=requestAnimationFrame(draw);
  var w=scope.clientWidth-CLOCK_W, h=scope.clientHeight;
  ctx.clearRect(0,0,scope.clientWidth,h);
  if (!analyser) return;
  var n=analyser.fftSize, buf=new Uint8Array(n);
  analyser.getByteTimeDomainData(buf);

  // Peak of this frame, then a gain that maps it near the top of the
  // window. Speech sits around -20 dBFS, which at a fixed scale is about
  // two pixels of movement on a 46px window — technically correct and
  // useless to look at. Gain rises quickly and falls slowly so the trace
  // does not pump between syllables.
  var peak=0;
  for (var k=0;k<n;k++){ var a=Math.abs(buf[k]-128)/128; if (a>peak) peak=a; }
  var want = peak > FLOOR ? Math.min(0.86/peak, 14) : 0;
  gain += (want - gain) * (want > gain ? 0.35 : 0.06);

  var amp = h/2 - 3;
  ctx.lineWidth=1.5;
  ctx.strokeStyle = paused ? '#6b7280' : '#f59e0b';
  ctx.beginPath();
  for (var i=0;i<n;i++){
    var x=i/(n-1)*w;
    var y=h/2 + ((buf[i]-128)/128) * gain * amp;
    if (y<1) y=1; if (y>h-1) y=h-1;
    i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.stroke();
  clock.textContent=mmss(elapsed());
}

function pick(){
  // Highest quality the browser will actually give us. MediaRecorder has
  // no WAV; opus is the honest maximum and 128k was measured transparent.
  var want=['audio/webm;codecs=opus','audio/webm',
            'audio/ogg;codecs=opus','audio/mp4'];
  for (var i=0;i<want.length;i++){
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(want[i])) return want[i];
  }
  return '';
}

function keys(state){
  bRec.disabled   = (state==='rec'||state==='pause');
  bPause.disabled = !(state==='rec'||state==='pause');
  bStop.disabled  = !(state==='rec'||state==='pause');
  bFile.disabled  = (state==='rec'||state==='pause'||state==='sending');
  bRec.disabled   = bRec.disabled || state==='sending' || state==='retry';
  var lbl=document.getElementById('lFile');
  if (state==='retry')       { lbl.textContent = L_RETRY; bFile.className='key arm'; }
  else if (state==='sending'){ lbl.textContent = L_SENDING; }
  else                       { lbl.textContent = L_OPEN; }
  bRec.className   = 'key' + (state==='rec' ? ' arm' : '');
  bPause.className = 'key' + (state==='pause' ? ' on' : '');
  clock.className  = (state==='rec') ? 'live' : '';
}

async function start(){
  try {
    media = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount:1, echoCancellation:false, noiseSuppression:false,
               autoGainControl:false }
    });
  } catch (e) {
    say('microphone refused — check the browser permission', true);
    return;
  }
  var mime=pick();
  try {
    rec = new MediaRecorder(media, mime ? { mimeType:mime, audioBitsPerSecond:128000 }
                                        : { audioBitsPerSecond:128000 });
  } catch (e) {
    try { rec = new MediaRecorder(media); }
    catch (e2) { say('this browser cannot record', true); return; }
  }
  chunks=[];
  rec.ondataavailable=function(e){ if (e.data && e.data.size) chunks.push(e.data); };
  rec.onerror=function(){ say('recording stopped unexpectedly', true); };
  rec.onstop=finish;

  actx = new (window.AudioContext||window.webkitAudioContext)();
  if (actx.state==='suspended') { try { await actx.resume(); } catch(e){} }
  analyser = actx.createAnalyser();
  analyser.fftSize=1024; analyser.smoothingTimeConstant=0.6;
  actx.createMediaStreamSource(media).connect(analyser);

  acc=0; t0=Date.now(); running=true; paused=false; lastBlob=null;
  rec.start(1000);              // a chunk a second: a crash loses one second
  fit(); if (!raf) draw();
  keys('rec'); say('');
}

function finish(){
  running=false; paused=false;
  if (raf) { cancelAnimationFrame(raf); raf=null; }
  flatline();
  var type = (chunks[0] && chunks[0].type) || 'audio/webm';
  lastBlob = new Blob(chunks, { type:type });
  if (media) { media.getTracks().forEach(function(t){ t.stop(); }); media=null; }
  if (actx) { try { actx.close(); } catch(e){} actx=null; }
  analyser=null;
  clock.textContent=mmss(acc);
  if (!lastBlob.size) { keys('idle'); say('nothing was recorded', true); return; }
  // Stop IS the send. Baba's correction: pressing stop should transcribe,
  // not arm a second button. One less press on every single take.
  send(lastBlob, '', Math.round(acc/1000));
}

bRec.onclick=function(){ if (!running) start(); };

bPause.onclick=function(){
  if (!rec) return;
  if (!paused) {
    try { rec.pause(); } catch(e){}
    acc += Date.now()-t0; paused=true; keys('pause'); say('paused');
  } else {
    try { rec.resume(); } catch(e){}
    t0=Date.now(); paused=false; keys('rec'); say('');
  }
};

bStop.onclick=function(){
  if (!rec) return;
  if (!paused) acc += Date.now()-t0;
  paused=false;
  try { rec.stop(); } catch(e){ finish(); }
};

// A file has to cross the websocket base64'd, which inflates it by a
// third. Streamlit's own uploader has a proper transfer path for big
// files, so anything past this is handed back to it rather than risked
// here — see TOO_BIG handling in app.py.
var MAX_SEND = 45 * 1024 * 1024;

// ── BULLETPROOF SENDING ──────────────────────────────────────────────
//
// Baba records for half an hour in a forest where the internet comes and
// goes. The dangerous moment is pressing stop while the socket is down:
// the recording is sitting right here in the browser and the app has no
// idea it never arrived.
//
// setComponentValue posts to the parent frame and tells us nothing about
// whether it survived the trip. So Python ECHOES BACK the stamp it
// received, and anything not acknowledged is sent again. The blob is
// held here until an ack proves it landed — never dropped on the
// assumption that a send worked.
//
// Five automatic attempts with a lengthening wait, then it STOPS and the
// fourth cell becomes "retry". It stops on purpose: after five failures
// over a minute the connection is properly gone, and hammering it drains
// a phone battery that may be the only one for hours.
var MAX_TRIES = 5;
var BACKOFF = [2000, 4000, 8000, 15000, 25000];
var pending = null;      // {blob, name, secs, stamp, tries}
var ackTimer = null;

// A BRAILLE SPINNER, because a 7 MB upload followed by a transcription
// looked completely stale — Baba sent it and had no way to tell whether
// anything was happening or the app had died. It runs from the moment a
// send starts until Python acknowledges, which covers BOTH the upload and
// the transcription, so it stops exactly when the words appear.
var SPIN = '\u280b\u2819\u2839\u2838\u283c\u2834\u2826\u2827\u2807\u280f';
var spinI = 0, spinTimer = null, sendT0 = 0;

function kb(n){ return Math.round(n/1024); }

function spinTick(){
  if (!pending) return;
  spinI = (spinI + 1) % SPIN.length;
  var el = (Date.now() - sendT0) / 1000;
  var rate = el > 0.3 ? '  \u00b7  ' + Math.round(kb(pending.blob.size)/el) + ' KB/s' : '';
  msg.className = '';
  msg.textContent = SPIN[spinI] + '  ' + kb(pending.blob.size) + ' KB  \u00b7  '
                  + el.toFixed(1) + 's' + rate
                  + (pending.tries ? '  \u00b7  try ' + (pending.tries+1) : '');
}

function startSpin(){
  sendT0 = sendT0 || Date.now();
  if (spinTimer) return;
  spinTimer = setInterval(spinTick, 90);
  spinTick();
}
function stopSpin(){
  if (spinTimer) { clearInterval(spinTimer); spinTimer=null; }
}

function clearAck(){ if (ackTimer) { clearTimeout(ackTimer); ackTimer=null; } }

function armAck(){
  clearAck();
  if (!pending) return;
  var wait = BACKOFF[Math.min(pending.tries, BACKOFF.length-1)];
  ackTimer = setTimeout(function(){
    if (!pending) return;
    if (pending.tries >= MAX_TRIES){
      stopSpin();
      keys('retry');
      say('not sent after ' + MAX_TRIES + ' tries — press retry', true);
      return;
    }
    pending.tries++;
    startSpin();
    postPending();
  }, wait);
}

function postPending(){
  if (!pending) return;
  var fr=new FileReader();
  fr.onerror=function(){ armAck(); };
  fr.onload=function(){
    var s=String(fr.result||''), i=s.indexOf(',');
    setValue({ b64: i<0 ? s : s.slice(i+1),
               mime: pending.blob.type || 'application/octet-stream',
               name: pending.name || '',
               seconds: pending.secs || 0,
               bytes: pending.blob.size,
               at: pending.stamp });
    armAck();
  };
  fr.readAsDataURL(pending.blob);
}

// The browser tells us the moment the connection is back. Waiting out a
// 25-second backoff when the signal has already returned is time nobody
// should spend looking at a phone in a forest.
window.addEventListener('online', function(){
  if (pending) { pending.tries = 0; say('back online — sending'); postPending(); }
});

function send(blob, name, secs){
  if (!blob || !blob.size) return;
  if (blob.size > MAX_SEND) {
    setValue({ toobig:true, bytes:blob.size, name:name||'', at:Date.now() });
    say('too large for the deck — use the file box below', true);
    keys('idle');
    return;
  }
  pending = { blob: blob, name: name||'', secs: secs||0,
              stamp: Date.now(), tries: 0 };
  sendT0 = Date.now();
  keys('sending');
  startSpin();
  postPending();
}

// Called when Python confirms it has the recording. Only here is the
// blob allowed to be forgotten.
function acked(stamp){
  if (!pending || String(pending.stamp) !== String(stamp)) return;
  clearAck(); stopSpin();
  // What it cost, kept on screen: size, how long the whole round trip
  // took, and the rate. After a long recording in a weak signal these are
  // the numbers worth knowing before starting another one.
  var el = (Date.now() - sendT0) / 1000;
  var size = kb(pending.blob.size);
  say('sent  ' + size + ' KB  \u00b7  ' + el.toFixed(1) + 's  \u00b7  '
      + Math.round(size/Math.max(el,0.1)) + ' KB/s');
  sendT0 = 0;
  pending=null; lastBlob=null; keys('idle'); clock.textContent='0:00';
}

function retryNow(){
  if (!pending) return;
  pending.tries = 0;
  sendT0 = Date.now();
  keys('sending');
  startSpin();
  postPending();
}

// TAP = FILE PICKER. Nothing is read from the clipboard on a tap.
//
// Reading the clipboard programmatically (navigator.clipboard.read) needs
// a permission, prompts, and is refused outright in some browsers. A REAL
// PASTE needs none of that: the user pressing Ctrl+V — or long-press,
// Paste on Android — IS the consent, and the event hands us the contents
// directly. No extension is required for this and none would help.
bFile.onclick=function(){
  if (running) return;
  if (pending) { retryNow(); return; }   // the cell IS the retry control
  picker.click();
};

// Paste needs somewhere to land, so a hidden sink takes focus whenever
// the deck is touched anywhere that is not a button. Same trick as
// paste_frontend, which is already proven on the phone.
function armPaste(){ try { sink.focus({preventScroll:true}); } catch(e){} }
document.getElementById('deck').addEventListener('mousedown', function(e){
  if (!e.target.closest('button')) armPaste();
});
document.getElementById('deck').addEventListener('touchstart', function(e){
  if (!e.target.closest('button')) armPaste();
}, {passive:true});

document.addEventListener('paste', function(e){
  if (running) return;                 // never interrupt a take
  var dt = e.clipboardData || window.clipboardData;
  if (!dt) return;

  // A picture first: an image on the clipboard is unambiguous, and its
  // file is right there in the event with no permission asked.
  var items = dt.items || [];
  for (var i=0;i<items.length;i++){
    if (items[i].kind === 'file' && (items[i].type||'').indexOf('image/')===0){
      var f = items[i].getAsFile();
      if (f && f.size){
        e.preventDefault();
        var ext=(f.type.split('/')[1]||'png').split('+')[0];
        say('pasted picture');
        send(f, 'pasted.'+ext, 0);
        return;
      }
    }
  }
  var txt = dt.getData('text/plain') || '';
  if (txt.trim()){
    e.preventDefault();
    say('pasted text — ' + txt.trim().length + ' characters');
    setValue({ text: txt, name: 'pasted.txt', bytes: txt.length,
               seconds: 0, at: Date.now() });
    sink.value='';
  }
});

picker.onchange=function(){
  var f=picker.files && picker.files[0];
  picker.value='';
  if (f) send(f, f.name, 0);
};

window.addEventListener("message", function(ev){
  var m=ev.data;
  if (!m || m.type!=="streamlit:render") return;
  // Python echoes the stamp of whatever it received. This is the only
  // proof a send arrived.
  var ackStamp=(m.args||{}).ack;
  if (ackStamp) acked(ackStamp);
  var a=(m.args||{}).labels;
  if (a) {
    document.getElementById('lRec').textContent   = a.rec   || 'rec';
    document.getElementById('lPause').textContent = a.pause || 'pause';
    document.getElementById('lStop').textContent  = a.stop  || 'stop';
  }
  height();
});

window.addEventListener('resize', function(){ if (!running) flatline(); });

if (!navigator.mediaDevices || !window.MediaRecorder) {
  say('this browser cannot record audio', true);
  bRec.disabled=true;
}
keys('idle');
flatline();
post("streamlit:componentReady", { apiVersion: 1 });
height();
</script>
